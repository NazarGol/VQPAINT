<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VQPAINT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="home">
  <span class="pill title">VQPAINT</span>
  <span class="quiet" style="text-align:center;max-width:320px">A group writes notes. Each note becomes a stroke of one shared painting, generated in your own browser.</span>
  <div id="gpu-notice" class="pill" hidden style="max-width:320px;white-space:normal;text-align:center"></div>
  <div class="row"><input id="name" type="text" placeholder="your name (optional)"></div>
  <div class="row"><button id="create" class="pill active">create a room</button></div>
  <div class="row"><input id="join-id" type="text" placeholder="paste an invite link or room id"><button id="join" class="pill">join</button></div>
  <span class="quiet" style="text-align:center;max-width:320px">First visit downloads about 90 MB to watch and 200 MB to paint; kept in the browser cache. Chrome, Edge or Safari 26+. <a href="https://github.com/NazarGol/VQPAINT/tree/web-spikes/web">source</a></span>
</div>
<script type="module" src="landing.js"></script>
</body>
</html>
