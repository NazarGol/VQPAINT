name = "vqpaint-rooms"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "TG_DIR", class_name = "TgDirectory" },
  { name = "LOGDIR", class_name = "LogDirectory" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TgDirectory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LogDirectory"]

[triggers]
crons = ["0 9 * * 1", "0 * * * *"]
